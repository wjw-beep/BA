[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalquery-reproduction"
version = "1.0.0"
description = "Configurable implementation of CausalQuery coordinated evidence interventions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "scikit-learn>=1.3"]

[project.scripts]
causalquery = "causalquery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
